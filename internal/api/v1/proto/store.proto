syntax = "proto3";
package store.v1;
option go_package = "internal/api/v1";


message KVPair {
  string key = 1;
  string value = 2;
}

message Record {
  string operation = 1; // "PUT" or "DEL" 
  KVPair data = 2;
}

message Response {
  string value = 1;
}
message Empty{}

service KVStoreService {
  rpc Put(KVPair) returns (Response) ;
  rpc Get(KVPair) returns (Response);
  rpc Delete(KVPair) returns (Empty);
  rpc GetServers(GetServersRequest) returns (GetServersResponse) {}
}




// START: get_servers
message GetServersRequest {}

message GetServersResponse {
  repeated Server servers = 1;
}

message Server {
  string id = 1;
  string rpc_addr = 2;
  bool is_leader = 3;
}


